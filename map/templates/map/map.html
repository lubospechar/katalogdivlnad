
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #info-panels {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-panel {
            background: white;
            padding: 12px 18px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            font: 14px Arial, sans-serif;
        }

        .feature-counter {
            margin-bottom: 6px;
        }

        #feature-warning,
        #polygon-warning {
            display: none;
            margin-top: 8px;
            color: #b45309;
            font-weight: bold;
        }

        #polygon-loading {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: #c62828;
        }

        .loading-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #f4cccc;
            border-top-color: #c62828;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #feature-info {
            display: none;
            width: min(350px, calc(100vw - 40px));
            box-sizing: border-box;
            max-height: 65vh;
            overflow-y: auto;
        }

        #feature-info h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        #feature-info .feature-detail {
            margin-top: 5px;
        }

        #feature-info h4 {
            margin: 16px 0 10px;
            padding-top: 12px;
            border-top: 1px solid #dddddd;
            font-size: 14px;
        }

        #measure-status {
            color: #666666;
            font-size: 13px;
        }

        #measure-list {
            margin: 0;
            padding-left: 20px;
        }

        #measure-list li {
            margin-bottom: 9px;
            line-height: 1.4;
        }

        #measure-list a {
            color: #0066cc;
            text-decoration: none;
        }

        #measure-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="info-panels">

    <!-- Feature counters -->
    <div id="info-panel" class="info-panel">

        <div class="feature-counter">
            KDK lines in view:
            <strong id="feature-count">Loading...</strong>
        </div>

        <div class="feature-counter">
            PovIV_W polygons in view:
            <strong id="polygon-count">Loading...</strong>
        </div>

        <div id="feature-warning">
            Too many lines (max. 20,000). Please zoom in.
        </div>

        <div id="polygon-loading" role="status">
            <span class="loading-spinner"
                  aria-hidden="true"></span>
            <span>Loading PovIV_W polygons...</span>
        </div>

        <div id="polygon-warning">
            Too many polygons (max. 5,000). Please zoom in.
        </div>

    </div>

    <!-- Selected feature information -->
    <div id="feature-info" class="info-panel">

        <h3>Selected feature</h3>

        <div class="feature-detail">
            Layer:
            <strong id="selected-feature-layer"></strong>
        </div>

        <div class="feature-detail">
            ID:
            <strong id="selected-feature-id"></strong>
        </div>

        <h4>Measures (mock data)</h4>

        <div id="measure-status" role="status"></div>

        <ol id="measure-list"></ol>

    </div>

</div>

<script>
    // Feature limits
    const MAX_LINE_FEATURES = 20000;
    const MAX_POLYGON_FEATURES = 5000;

    // Initialize map
    const map = L.map('map', {
        preferCanvas: true
    }).setView([49.8, 15.5], 8);

    // Base map
    L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
            referrerPolicy: 'strict-origin-when-cross-origin'
        }
    ).addTo(map);

    // Information elements
    const featureCount =
        document.getElementById('feature-count');

    const polygonCount =
        document.getElementById('polygon-count');

    const featureWarning =
        document.getElementById('feature-warning');

    const polygonWarning =
        document.getElementById('polygon-warning');

    const polygonLoading =
        document.getElementById('polygon-loading');

    const featureInfo =
        document.getElementById('feature-info');

    const selectedFeatureLayer =
        document.getElementById('selected-feature-layer');

    const selectedFeatureId =
        document.getElementById('selected-feature-id');

    const measureStatus =
        document.getElementById('measure-status');

    const measureList =
        document.getElementById('measure-list');

    // Active requests
    let activeController = null;
    let activeSelectionController = null;

    // Fetch JSON with abort support
    async function fetchJson(url, signal) {
        const response = await fetch(url, {
            signal: signal
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        return await response.json();
    }

    // Hide selected feature and cancel pending request
    function hideFeatureInfo() {
        if (activeSelectionController) {
            activeSelectionController.abort();
            activeSelectionController = null;
        }

        featureInfo.style.display = 'none';
        measureList.replaceChildren();
        measureStatus.textContent = '';
    }

    // Select map feature and load its mock measures
    async function selectFeature(
        featureType,
        layerName,
        featureId
    ) {
        // Cancel previous selection request
        if (activeSelectionController) {
            activeSelectionController.abort();
        }

        const controller = new AbortController();
        activeSelectionController = controller;

        // Display selected feature information
        selectedFeatureLayer.textContent = layerName;
        selectedFeatureId.textContent =
            featureId ?? 'Unknown';

        measureList.replaceChildren();

        measureStatus.textContent =
            'Loading measures...';

        featureInfo.style.display = 'block';

        // Check feature ID
        if (featureId == null) {
            measureStatus.textContent =
                'Feature ID is missing.';
            return;
        }

        try {
            // Request mock measures
            const url =
                `/map/feature/${encodeURIComponent(featureType)}/` +
                `${encodeURIComponent(featureId)}/`;

            const data = await fetchJson(
                url,
                controller.signal
            );

            if (
                controller.signal.aborted ||
                activeSelectionController !== controller
            ) {
                return;
            }

            if (!Array.isArray(data.measures)) {
                throw new Error(
                    'Invalid measures response.'
                );
            }

            measureStatus.textContent = '';

            // No measures found
            if (data.measures.length === 0) {
                measureStatus.textContent =
                    'No measures available.';
                return;
            }

            // Display measures as clickable links
            for (const measure of data.measures) {
                const item = document.createElement('li');
                const link = document.createElement('a');

                link.textContent = measure.name;
                link.href = measure.url;

                // Open measure details in a new tab
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                item.appendChild(link);
                measureList.appendChild(item);
            }

        } catch (error) {
            if (error.name === 'AbortError') {
                return;
            }

            console.error(
                'Failed to load feature measures:',
                error
            );

            if (activeSelectionController === controller) {
                measureStatus.textContent =
                    'Unable to load measures.';
            }
        }
    }

    // Polygon layer - bottom (red)
    const polygonLayer = L.geoJSON(null, {
        style: {
            color: '#c62828',
            weight: 1,
            opacity: 0.9,
            fillColor: '#e53935',
            fillOpacity: 0.20
        },

        interactive: true,

        onEachFeature: function(feature, layer) {
            layer.on('click', function() {
                selectFeature(
                    'poviv_w',
                    'PovIV_W',
                    feature.id
                );
            });
        }
    }).addTo(map);

    // Line layer - top (blue)
    const kdkLayer = L.geoJSON(null, {
        style: {
            color: '#0066cc',
            weight: 2,
            opacity: 0.9
        },

        interactive: true,

        onEachFeature: function(feature, layer) {
            layer.on('click', function() {
                selectFeature(
                    'kdk',
                    'KDK',
                    feature.id
                );
            });
        }
    }).addTo(map);

    // Layer visibility control
    L.control.layers(
        null,
        {
            'PovIV_W (polygons)': polygonLayer,
            'KDK (lines)': kdkLayer
        },
        {
            position: 'topleft',
            collapsed: false
        }
    ).addTo(map);

    // Keep lines above polygons
    function bringLinesToFront() {
        if (!map.hasLayer(kdkLayer)) {
            return;
        }

        kdkLayer.eachLayer(function(layer) {
            layer.bringToFront();
        });
    }

    // Current map bounds
    function getMapBounds() {
        const bounds = map.getBounds();

        return [
            bounds.getWest(),
            bounds.getSouth(),
            bounds.getEast(),
            bounds.getNorth()
        ].join(',');
    }

    // Load KDK count and geometries
    async function loadKDK(bbox, controller) {
        try {
            // Request feature count
            const countData = await fetchJson(
                `/map/bounds/?bbox=${bbox}`,
                controller.signal
            );

            if (controller.signal.aborted) {
                return;
            }

            const count = countData.count;

            featureCount.textContent =
                count.toLocaleString('en-US');

            // Skip geometry loading if layer is disabled
            if (!map.hasLayer(kdkLayer)) {
                return;
            }

            // Check feature limit
            if (count > MAX_LINE_FEATURES) {
                featureWarning.style.display = 'block';
                return;
            }

            // Request line geometries
            const linesData = await fetchJson(
                `/map/lines/?bbox=${bbox}`,
                controller.signal
            );

            if (
                controller.signal.aborted ||
                !map.hasLayer(kdkLayer)
            ) {
                return;
            }

            if (
                linesData.too_many ||
                (
                    linesData.count != null &&
                    linesData.count > MAX_LINE_FEATURES
                )
            ) {
                featureWarning.style.display = 'block';
                return;
            }

            // Render KDK lines
            kdkLayer.addData(linesData);

            // Keep lines above polygons
            bringLinesToFront();

        } catch (error) {
            if (error.name === 'AbortError') {
                return;
            }

            console.error(
                'Failed to load KDK:',
                error
            );

            if (activeController === controller) {
                featureCount.textContent = 'Unavailable';
            }
        }
    }

    // Load PovIV_W polygon count and geometries
    async function loadPolygons(bbox, controller) {
        try {
            // Request polygon geometries
            const polygonData = await fetchJson(
                `/map/polygons/?bbox=${bbox}`,
                controller.signal
            );

            if (
                controller.signal.aborted ||
                !map.hasLayer(polygonLayer)
            ) {
                return;
            }

            // Update polygon count
            const count = polygonData.count ??
                polygonData.features?.length ?? 0;

            polygonCount.textContent =
                count.toLocaleString('en-US');

            // Check polygon limit
            if (
                polygonData.too_many ||
                count > MAX_POLYGON_FEATURES
            ) {
                polygonWarning.style.display = 'block';
                return;
            }

            // Render PovIV_W polygons
            polygonLayer.addData(polygonData);

            // Preserve layer ordering
            bringLinesToFront();

        } catch (error) {
            if (error.name === 'AbortError') {
                return;
            }

            console.error(
                'Failed to load PovIV_W:',
                error
            );

            if (activeController === controller) {
                polygonCount.textContent = 'Unavailable';
            }

        } finally {
            // Hide indicator for the current request
            if (activeController === controller) {
                polygonLoading.style.display = 'none';
            }
        }
    }

    // Update all map layers
    async function updateMap() {
        // Cancel previous map requests
        if (activeController) {
            activeController.abort();
        }

        const controller = new AbortController();
        activeController = controller;

        // Clear previous geometries
        polygonLayer.clearLayers();
        kdkLayer.clearLayers();

        // Clear previous feature selection
        hideFeatureInfo();

        // Reset counters
        featureCount.textContent = 'Loading...';

        polygonCount.textContent =
            map.hasLayer(polygonLayer)
                ? 'Loading...'
                : 'Off';

        // Reset warnings
        featureWarning.style.display = 'none';
        polygonWarning.style.display = 'none';

        // Show polygon loading indicator when enabled
        polygonLoading.style.display =
            map.hasLayer(polygonLayer)
                ? 'flex'
                : 'none';

        // Current bounds
        const bbox = encodeURIComponent(
            getMapBounds()
        );

        // Load KDK independently
        const requests = [
            loadKDK(bbox, controller)
        ];

        // Load polygons only when enabled
        if (map.hasLayer(polygonLayer)) {
            requests.push(
                loadPolygons(bbox, controller)
            );
        }

        await Promise.all(requests);
    }

    // Update after moving or zooming
    map.on('moveend', updateMap);

    // Update when switching layers
    map.on('overlayadd overlayremove', updateMap);

    // Initial load
    updateMap();
</script>

</body>
</html>
