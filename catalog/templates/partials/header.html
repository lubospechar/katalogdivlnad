{% load i18n static %}

<!-- Top bar with logos, nav, language -->
<div class="header-bar">
    <div class="header-logos">
        <a href="https://divland.cz/"><img src="{% static 'catalog/img/logos/logo-divland.png' %}" alt="DIVLAND"></a>
        <a href="https://tacr.cz" target="_blank" rel="noopener"><img src="{% static 'catalog/img/logos/logo-tacr.png' %}" alt="TAČR"></a>
        <a href="https://fzp.czu.cz" target="_blank" rel="noopener"><img src="{% static 'catalog/img/logos/logo-czu-fzp.png' %}" alt="ČZU FŽP"></a>
    </div>

    <nav class="header-nav">
        <ul>
            <li><a href="{% url 'home' %}">{% trans "About" %}</a></li>
            <li class="dropdown">
                <a href="{% url 'groups-all' %}">{% trans "Catalogue" %}</a>
                <ul class="dropdown-menu">
                    <li><a href="{% url 'groups-all' %}">{% trans "All" %}</a></li>
                    {% for group in groups_nav %}
                        <li><a href="{% url 'group-filter' group.id %}">{{ group }}</a></li>
                    {% endfor %}

                </ul>
            </li>

            <li><a href="{% url 'contacts' %}">{% translate 'Kontakty' %}</a></li>

        </ul>
    </nav>

    <div class="header-lang">
        <form action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">

            <!-- Czech flag -->
            <button type="submit" name="language" value="cs"
                    class="{% if LANGUAGE_CODE == 'cs' %}active{% endif %}">
                <span class="fi fi-cz"></span>
            </button>

            <!-- English flag -->
            <button type="submit" name="language" value="en"
                    class="{% if LANGUAGE_CODE == 'en' %}active{% endif %}">
                <span class="fi fi-gb"></span>
            </button>
        </form>
    </div>
</div>
